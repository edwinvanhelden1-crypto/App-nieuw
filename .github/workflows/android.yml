name: Android app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk SoundbarEQ.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SoundbarEQ-apk
          path: android/SoundbarEQ.apk

      # A fixed download link for the phone: Releases › "Soundbar EQ (nieuwste versie)".
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: android-latest
          name: Soundbar EQ (nieuwste versie)
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: android/SoundbarEQ.apk
          body: |
            Installeer `SoundbarEQ.apk` op je Android-telefoon (Android 9 of nieuwer).
            Gebouwd van commit ${{ github.sha }}.
